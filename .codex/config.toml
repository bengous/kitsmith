[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bun .codex/hooks/guard-destructive.ts'
timeout = 10
statusMessage = "Checking destructive commands"

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|Write|MultiEdit)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bun .codex/hooks/guard-edit-paths.ts'
timeout = 10
statusMessage = "Checking edited paths"

[[hooks.PostToolUse]]
matcher = "^(apply_patch|Edit|Write|MultiEdit)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'bun .codex/hooks/post-edit-quality.ts'
timeout = 90
statusMessage = "Formatting and linting edited files"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'bun .codex/hooks/stop-validate.ts'
timeout = 240
statusMessage = "Running Codex validation"

# BEGIN KITSMITH INTERNAL HOOKS
# Parent-only Codex hooks for this repository.
# parent-tooling:sync preserves this block verbatim.
[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|Write|MultiEdit)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bun scripts/validation/guard-parent-tooling-target-edits.ts'
timeout = 10
statusMessage = "Checking parent tooling managed targets"
# END KITSMITH INTERNAL HOOKS
