name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select CI mode
        id: gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci-gate.sh

  light-checks:
    name: light-checks
    needs: ci-gate
    if: needs.ci-gate.outputs.mode == 'light'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: lychee

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check agent docs
        run: bun run agents:check

      - name: Check links
        run: bun run check:links

      - name: Check format
        run: bun run format:check

  quality-linux:
    name: quality-linux
    needs: ci-gate
    if: needs.ci-gate.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: pkl github:lycheeverse/lychee

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deep
        run: bun run validate:deep

      - name: Build package
        run: bun run build

  quality-windows:
    name: quality-windows
    needs: ci-gate
    if: needs.ci-gate.outputs.mode == 'full'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: pkl github:lycheeverse/lychee

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deep
        run: bun run validate:deep

      - name: Build package
        run: bun run build

  generated-linux:
    name: generated-linux
    needs: ci-gate
    if: needs.ci-gate.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: pkl

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated project contract
        run: bun run validate:generated

  generated-windows:
    name: generated-windows
    needs: ci-gate
    if: needs.ci-gate.outputs.mode == 'full'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install_args: pkl

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated project contract
        run: bun run validate:generated

  sandbox-linux:
    name: sandbox-linux
    needs: ci-gate
    if: needs.ci-gate.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate sandbox contract
        run: bun scripts/validation/validate.ts --plan sandbox --jobs 1 --verbose
        env:
          KITSMITH_E2E_CONTRACT_JOBS: "1"
          KITSMITH_SMOKE_JOBS: "1"

  ci-result:
    name: ci-result
    needs:
      - ci-gate
      - light-checks
      - quality-linux
      - quality-windows
      - generated-linux
      - generated-windows
      - sandbox-linux
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Check selected CI lane
        env:
          MODE: ${{ needs.ci-gate.outputs.mode }}
          GATE_RESULT: ${{ needs.ci-gate.result }}
          LIGHT_RESULT: ${{ needs.light-checks.result }}
          QUALITY_LINUX_RESULT: ${{ needs.quality-linux.result }}
          QUALITY_WINDOWS_RESULT: ${{ needs.quality-windows.result }}
          GENERATED_LINUX_RESULT: ${{ needs.generated-linux.result }}
          GENERATED_WINDOWS_RESULT: ${{ needs.generated-windows.result }}
          SANDBOX_LINUX_RESULT: ${{ needs.sandbox-linux.result }}
        run: .github/scripts/ci-result.sh
